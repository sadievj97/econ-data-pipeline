# Settings for the data pipeline. Safe to edit.
# Never put keys here: they go in .env, which git ignores.

# The Claude model used only to turn your request into a draft spec.
# It never sees, produces, or edits data values.
models:
  spec_drafting: claude-opus-5-5
  effort: high          # how hard it thinks: low, medium, high, xhigh, max
  max_tokens: 16000

# Downloads.
http:
  timeout_seconds: 120
  attempts: 4           # tries per download before giving up

# Validation settings. Checks never change values; they stop the build (errors) or
# list things to look at (flags) in out/<spec name>/validation_report.md.
checks:
  # Default thresholds the request step writes into new specs, also used to compare a
  # variable's fallback sources with the one chosen.
  comparison_threshold:
    growth: 1.0         # percentage points of annual growth
    level: 5.0          # percent difference in levels
  # Allowed values when a variable sets no valid_range. Outside the range is an error.
  # Levels and indexes must be above zero unless the variable sets allow_negative: true.
  plausible_range:
    share: [0, 1]
    percent: [0, 100]
    growth_rate: [-50, 100]
  # Year-to-year changes larger than these are flagged as possible breaks.
  jump:
    level_log_change: 0.4     # levels and indexes: |log change| above 0.4 (about +49% or -33%)
    percent_points: 10.0      # percent measures
    share_points: 0.1         # shares
  repeated_run: 3             # flag this many or more identical values in a row

# Growth accounting (used only by specs with a growth_accounting section).
growth_accounting:
  sensitivity_shares: [0.5, 0.6, 0.7]   # constant labor shares compared when a spec lists none

# Folders, relative to this project folder.
paths:
  raw_cache: data/raw     # every download, saved once with a timestamp, never modified
  manual: data/manual     # files downloaded by hand, each with a note on where it came from
  outputs: out            # results go in out/<spec name>/
